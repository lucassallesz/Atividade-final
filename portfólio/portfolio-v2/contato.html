<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Salles | Contato</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Estilo desta página -->
    <link rel="stylesheet" href="contato.css">
</head>
<body>

    <!-- CABEÇALHO COM O MENU -->
    <header class="cabecalho">
        <a href="index.html" class="logo">Lucas<span>.dev</span></a>
        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="formacao.html">Formação</a>
            <a href="contato.html" class="ativo">Contato</a>
        </nav>
    </header>

    <main>

        <section class="topo-pagina">
            <h1>Contato</h1>
            <p>Quer conversar? Me mande uma mensagem!</p>
        </section>

        <section class="contato">

            <!-- Cartões com as redes -->
            <div class="lista-contatos">
                <a href="https://www.linkedin.com/in/lucas-guilherme-salles" target="_blank" class="card">
                    <span class="icone">💼</span>
                    <h3>LinkedIn</h3>
                    <p>Meu perfil profissional</p>
                </a>
                <a href="https://github.com/lucasguilhermesalles" target="_blank" class="card">
                    <span class="icone">🐙</span>
                    <h3>GitHub</h3>
                    <p>Meus códigos</p>
                </a>
                <a href="mailto:lucasguilhermesalles@gmail.com" class="card">
                    <span class="icone">📧</span>
                    <h3>Gmail</h3>
                    <p>lucasguilhermesalles@gmail.com</p>
                </a>
            </div>

            <!-- Formulário de contato -->
            <form class="formulario" id="formulario">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite seu nome">

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" rows="5" placeholder="Escreva sua mensagem"></textarea>

                <button type="submit" class="botao">Enviar</button>

                <!-- Aqui o JavaScript escreve o aviso -->
                <p id="aviso" class="aviso"></p>
            </form>

        </section>

    </main>

    <!-- RODAPÉ -->
    <footer class="rodape">
        <div class="redes">
            <a href="https://www.linkedin.com/in/lucas-guilherme-salles" target="_blank">LinkedIn</a>
            <a href="https://github.com/lucasguilhermesalles" target="_blank">GitHub</a>
            <a href="mailto:lucasguilhermesalles@gmail.com">Gmail</a>
        </div>
        <p>© 2026 Lucas Guilherme Salles - Trabalho Final</p>
    </footer>

    <!-- JAVASCRIPT INTERNO (fica no final do body para a página carregar antes) -->
    <script>
        // Pegando o formulário pelo id
        let formulario = document.getElementById("formulario");

        // Função que confere se o formulário foi preenchido certo
        function validarFormulario(evento) {
            // Impede a página de recarregar quando clica em Enviar
            evento.preventDefault();

            // Pegando o que a pessoa digitou em cada campo
            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;
            let mensagem = document.getElementById("mensagem").value;

            // Pegando o parágrafo onde vai aparecer o aviso
            let aviso = document.getElementById("aviso");

            if (nome == "" || email == "" || mensagem == "") {
                // Se algum campo estiver vazio, mostra erro em vermelho
                aviso.textContent = "Por favor, preencha todos os campos!";
                aviso.style.color = "red";
            } else if (email.includes("@") == false) {
                // Se o e-mail não tiver @, mostra erro
                aviso.textContent = "Digite um e-mail válido!";
                aviso.style.color = "red";
            } else {
                // Se estiver tudo certo, mostra mensagem verde com o nome da pessoa
                aviso.textContent = "Obrigado, " + nome + "! Sua mensagem foi enviada.";
                aviso.style.color = "green";
                formulario.reset(); // limpa os campos
            }
        }

        // Quando o formulário for enviado, chama a função
        formulario.addEventListener("submit", validarFormulario);
    </script>

</body>
</html>
